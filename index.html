<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Color Formatter v2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        textarea:focus {
            border-color: #555;
        }
        #preview {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
            background-color: #1e1e1e;
            min-height: 50px;
            word-wrap: break-word;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            line-height: 1.4;
        }
        .label {
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <label class="label" for="input">Type your Minecraft text (e.g., &4&lHello &kMagic):</label>
    <textarea id="input" placeholder="Enter text with & color codes..."></textarea>

    <label class="label" style="margin-top: 30px;">Preview:</label>
    <div id="preview"></div>
</div>

<script>
    const colorMap = {
        '0': '#000000', '1': '#0000AA', '2': '#00AA00', '3': '#00AAAA',
        '4': '#AA0000', '5': '#AA00AA', '6': '#FFAA00', '7': '#AAAAAA',
        '8': '#555555', '9': '#5555FF', 'a': '#55FF55', 'b': '#55FFFF',
        'c': '#FF5555', 'd': '#FF55FF', 'e': '#FFFF55', 'f': '#FFFFFF'
    };

    const input = document.getElementById('input');
    const preview = document.getElementById('preview');

    function updatePreview() {
        let text = input.value;
        let html = '';
        let currentStyles = { color: '#FFFFFF', bold: false, italic: false, underline: false, strike: false, obfuscated: false };
        
        let parts = text.split(/&([0-9a-fk-or])/g);
        
        for (let i = 0; i < parts.length; i++) {
            if (i % 2 === 1) {
                let code = parts[i].toLowerCase();
                if (colorMap[code]) {
                    currentStyles = { color: colorMap[code], bold: false, italic: false, underline: false, strike: false, obfuscated: false };
                } else if (code === 'r') {
                    currentStyles = { color: '#FFFFFF', bold: false, italic: false, underline: false, strike: false, obfuscated: false };
                } else if (code === 'l') currentStyles.bold = true;
                else if (code === 'm') currentStyles.strike = true;
                else if (code === 'n') currentStyles.underline = true;
                else if (code === 'o') currentStyles.italic = true;
                else if (code === 'k') currentStyles.obfuscated = true;
            } else {
                let styleStr = `color: ${currentStyles.color};`;
                if (currentStyles.bold) styleStr += 'font-weight: bold;';
                if (currentStyles.italic) styleStr += 'font-style: italic;';
                
                let decorations = [];
                if (currentStyles.underline) decorations.push('underline');
                if (currentStyles.strike) decorations.push('line-through');
                if (decorations.length > 0) styleStr += `text-decoration: ${decorations.join(' ')};`;
                
                let content = parts[i];
                if (currentStyles.obfuscated) {
                    content = content.split('').map(char => {
                        if (char === ' ' || char === '\n') return char;
                        // Use a range of random characters similar to Minecraft obfuscation
                        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()";
                        return chars.charAt(Math.floor(Math.random() * chars.length));
                    }).join('');
                }

                html += `<span style="${styleStr}">${content}</span>`;
            }
        }
        preview.innerHTML = html;
    }

    input.addEventListener('input', updatePreview);

    // This makes the &k text scramble continuously
    setInterval(() => {
        if (input.value.includes('&k')) {
            updatePreview();
        }
    }, 50);
</script>

</body>
</html>
